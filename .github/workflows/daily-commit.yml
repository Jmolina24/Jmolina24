name: Daily Commit

on:
  schedule:
    - cron: "0 */2 * * *" # Todos los días a las 12:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write # Permitir escritura al repositorio
  issues: write   # Permitir crear issues para notificaciones

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar usuario git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Actualizar archivo update_log.txt
        run: |
          echo "Última actualización: $(date '+%Y-%m-%d %H:%M:%S')" > update_log.txt

      - name: Commit y push
        run: |
          git add update_log.txt
          git commit -m "chore: actualización automática [skip ci]" || echo "No hay cambios"
          git push

      - name: Notificar vía GitHub (crear issue)
        if: always() # cambiar a success() para notificar sólo en éxito, o failure() sólo en fallo
        uses: actions/github-script@v6
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow ${context.workflow} finalizado — Run ${context.runId}`,
              body: `Hola @Jmolina24,\n\nEl workflow **${context.workflow}** ha finalizado. Revisa el run: ${runUrl}\n\n(Este issue fue creado automáticamente por el workflow para notificar el resultado.)`
            });
