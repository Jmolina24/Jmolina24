name: Daily Commit

on:
  schedule:
    - cron: "0 * * * *" # Cada 1 hora (en minuto 0)
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write # Permitir escritura al repositorio
  issues: write   # Permitir crear/actualizar issues para notificaciones

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar usuario git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Actualizar archivo update_log.txt
        run: |
          echo "Última actualización: $(date '+%Y-%m-%d %H:%M:%S')" > update_log.txt

      - name: Commit y push
        run: |
          git add update_log.txt
          git commit -m "chore: actualización automática [skip ci]" || echo "No hay cambios"
          git push

      - name: Notificar vía GitHub (solo en éxito, y cerrar automáticamente)
        if: ${{ success() }}
        uses: actions/github-script@v6
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Workflow ${context.workflow} finalizado correctamente — Run ${context.runId}`;
            const body = `Hola @${context.repo.owner},\n\nEl workflow **${context.workflow}** ha finalizado correctamente. Revisa el run: ${runUrl}\n\n(Este issue fue creado automáticamente y se cerrará inmediatamente para evitar acumulación.)`;
            // Crear el issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            // Cerrar el issue inmediatamente
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: "closed"
            });
